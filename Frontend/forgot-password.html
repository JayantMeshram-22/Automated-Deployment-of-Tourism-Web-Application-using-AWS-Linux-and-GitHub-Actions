<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - Maheshwar Tourism</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #ff9800;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 15px;
      font-weight: bold;
    }

    input[type="password"], input[type="submit"] {
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    input[type="submit"] {
      background-color: #ff9800;
      color: white;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #e68900;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #ff9800;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<header>
  <h1>Maheshwar Tourism</h1>
</header>

<div class="container">
  <h2>Reset Your Password</h2>
  <form id="resetPasswordForm">
    <label for="new-password">New Password</label>
    <input type="password" id="new-password" name="new_password" required placeholder="Enter new password">

    <label for="confirm-password">Confirm Password</label>
    <input type="password" id="confirm-password" name="confirm_password" required placeholder="Confirm new password">

    <input type="submit" value="Reset Password">
  </form>
  <div class="back-link">
    <p><a href="login.html">Back to Login</a></p>
  </div>
</div>

<script>
  document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (newPassword !== confirmPassword) {
      alert("Passwords do not match. Please try again.");
    } else {
      alert("Password reset successful! Redirecting to login page...");
      window.location.href = "login.html"; // ✅ Redirect after success
    }
  });
</script>

</body>

</html>
