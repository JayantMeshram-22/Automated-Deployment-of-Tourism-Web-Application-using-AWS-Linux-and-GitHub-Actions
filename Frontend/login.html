<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Maheshwar Tourism</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #f4f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
    .login-box { background: #fff; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 10px; }
    .login-box h2 { text-align: center; margin-bottom: 25px; color: #333; }
    .login-box form { display: flex; flex-direction: column; }
    .login-box input[type="email"], .login-box input[type="password"] { padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
    .login-box input[type="submit"] { padding: 12px; background-color: #ff9800; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.3s ease; }
    .login-box input[type="submit"]:hover { background-color: #e68a00; }
    .login-box .links { margin-top: 15px; text-align: center; }
    .login-box .links a { color: #ff9800; text-decoration: none; margin: 0 5px; }
    .login-box .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login to Maheshwar Tourism</h2>
    <form id="loginForm">
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
      <input type="submit" value="Login">
    </form>

    <div class="links">
      <p><a href="forgot-password.html">Forgot Password?</a></p>
      <p>Don't have an account? <a href="register.html">Register Now</a></p>
    </div>
  </div>

  <script>
  // If user already logged in, redirect to intended page (if any)
  if (localStorage.getItem("isLoggedIn") === "true") {
    const redirectPage = localStorage.getItem("redirectAfterLogin") || "project-DEMO.html";
    localStorage.removeItem("redirectAfterLogin");
    if (redirectPage && redirectPage !== 'login.html') {
      window.location.href = redirectPage;
    } else {
      window.location.href = 'project-DEMO.html';
    }
  }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    localStorage.setItem('isLoggedIn', 'true');

    // Store email/name for pre-filling booking forms
    const email = document.getElementById('email').value;
    if (email) localStorage.setItem('userEmail', email);

    const redirectPage = localStorage.getItem('redirectAfterLogin');
    if (redirectPage && redirectPage !== 'login.html') {
      localStorage.removeItem('redirectAfterLogin');
      window.location.href = redirectPage;
    } else {
      window.location.href = 'project-DEMO.html';
    }
  });
</script>


</body>
</html>
