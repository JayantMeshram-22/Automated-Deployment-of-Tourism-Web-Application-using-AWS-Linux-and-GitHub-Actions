<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard | Maheshwar Tourism</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f4f7f9; color: #333; }

    header {
      background-color: #2e86c1; color: white;
      padding: 1.2rem 2rem; display: flex;
      justify-content: space-between; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    header h1 { font-size: 1.8rem; }
    .logout-btn {
      background-color: white; color: #2e86c1;
      padding: 0.5rem 1rem; border: none; border-radius: 4px;
      cursor: pointer; font-weight: bold;
    }
    .container { padding: 2rem; max-width: 1200px; margin: auto; }

    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 2rem; margin-top: 2rem;
    }
    .card {
      background: white; padding: 1.5rem; border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.3s;
    }
    .card:hover { transform: scale(1.02); }
    .card h3 { margin-bottom: .5rem; font-size: 1.3rem; color: #2e86c1; }
    .card p { font-size: .95rem; color: #666; }

    .add-place-form {
      margin-top: 3rem; background: white;
      padding: 2rem; border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .add-place-form h2 { color: #2e86c1; margin-bottom: 1rem; }
    .add-place-form input, .add-place-form select {
      width: 100%; padding: .8rem; margin-bottom: 1rem;
      border: 1px solid #ccc; border-radius: 6px;
    }
    .add-place-form button {
      background-color: #2e86c1; color: white;
      padding: .8rem 1.5rem; border: none;
      border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .add-place-form button:hover { background-color: #21618c; }

    .entries { margin-top: 2rem; }
    .entry {
      background: white; padding: 1rem; border-radius: 6px;
      margin-bottom: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .entry strong { color: #2e86c1; }
  </style>
</head>
<body>

  <header>
    <h1>Admin Dashboard - Maheshwar Tourism</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="container">

    <!-- Stats Cards -->
    <div class="card-grid">
      <div class="card">
        <h3><i class="fa-solid fa-location-dot"></i> Total Entries</h3>
        <p id="totalEntries">0 entries in system</p>
      </div>
      <div class="card">
        <h3><i class="fa-solid fa-ticket"></i> Total Bookings</h3>
        <p>82 bookings received this month</p>
      </div>
      <div class="card">
        <h3><i class="fa-solid fa-user"></i> Registered Users</h3>
        <p>135 users registered so far</p>
      </div>
      <div class="card">
        <h3><i class="fa-solid fa-chart-line"></i> Earnings</h3>
        <p>₹1,24,800 this month</p>
      </div>
    </div>

    <!-- Add Entry Form -->
    <div class="add-place-form">
      <h2><i class="fa-solid fa-plus"></i> Add New Entry</h2>
      <form id="addEntryForm">
        <select name="type" required>
          <option value="" disabled selected>Select Type</option>
          <option value="place">Tourist Place</option>
          <option value="hotel">Hotel</option>
          <option value="food">Food Center</option>
          <option value="shopping">Shopping Place</option>
          <option value="transport">Transport Option</option>
          <option value="guide">Local Guide</option>
        </select>
        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="location" placeholder="Location" required>
        <input type="number" name="price" placeholder="Price in ₹ (if applicable)">
        <button type="submit">Add Entry</button>
      </form>
    </div>

    <!-- Entries List -->
    <div class="entries">
      <h2 style="margin:1.5rem 0; color:#2e86c1;">All Entries</h2>
      <div id="entriesList"></div>
    </div>

  </div>

<script>
  // Protect page
  if (sessionStorage.getItem("isAdmin") !== "true") {
    window.location.href = "./admin-login.html";
  }

  // Logout
  function logout() {
    sessionStorage.removeItem("isAdmin");
    window.location.href = "./admin-login.html";
  }

  // Load entries
  function loadEntries() {
    const entries = JSON.parse(localStorage.getItem("entries")) || [];
    const entriesList = document.getElementById("entriesList");
    entriesList.innerHTML = entries.length === 0
      ? "<p>No entries yet.</p>"
      : entries.map(e =>
        `<div class="entry">
          <strong>[${e.type}]</strong> ${e.name} - ${e.location} 
          ${e.price ? ` | ₹${e.price}` : ""}
        </div>`).join("");

    document.getElementById("totalEntries").innerText = `${entries.length} entries in system`;
  }

  // Add entry
  document.getElementById("addEntryForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const entry = {
      type: formData.get("type"),
      name: formData.get("name"),
      location: formData.get("location"),
      price: formData.get("price")
    };

    let entries = JSON.parse(localStorage.getItem("entries")) || [];
    entries.push(entry);
    localStorage.setItem("entries", JSON.stringify(entries));

    alert("Entry added successfully!");
    this.reset();
    loadEntries();
  });

  // Initial load
  loadEntries();
</script>
</body>
</html>
