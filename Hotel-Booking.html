<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Booking - Maheshwar Tourism</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
    }
    .booking-container {
      max-width: 700px;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .booking-container h2 {
      text-align: center;
      color: #ff9800;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, select, textarea {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    input[type="submit"] {
      background-color: #ff9800;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      padding: 12px;
    }
    input[type="submit"]:hover {
      background-color: #e68a00;
    }
    .note {
      font-size: 13px;
      color: #777;
      text-align: center;
      margin-top: -10px;
      margin-bottom: 20px;
    }
    #priceDisplay {
      text-align: center;
      font-weight: bold;
      color: #ff9800;
      font-size: 18px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<header>
  <h1>Maheshwar Tourism</h1>
</header>

<section class="booking-container">
  <h2>Hotel Booking</h2>
  <form id="hotelBookingForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="hotel">Select Hotel</label>
    <select id="hotel" name="hotel" required>
      <option value="">-- Choose a hotel --</option>
      <option value="Hotel Raj Palace" data-price="799">Hotel Raj Palace - ₹799/night</option>
      <option value="Ganga Guesthouse" data-price="699">Ganga Guesthouse - ₹699/night</option>
      <option value="Heritage Inn" data-price="999">Heritage Inn - ₹999/night</option>
      <option value="Fortview Hotel" data-price="850">Fortview Hotel - ₹850/night</option>
      <option value="Shanti Nivas Lodge" data-price="550">Shanti Nivas Lodge - ₹550/night</option>
      <option value="Riverside Residency" data-price="1100">Riverside Residency - ₹1100/night</option>
    </select>

    <label for="rooms">Number of Rooms</label>
    <input type="number" id="rooms" name="rooms" placeholder="e.g., 1" min="1" required>

    <label for="guests">Number of Guests</label>
    <input type="number" id="guests" name="guests" placeholder="e.g., 2" min="1" required>

    <label for="checkin">Check-In Date</label>
    <input type="date" id="checkin" name="checkin" required>

    <label for="checkout">Check-Out Date</label>
    <input type="date" id="checkout" name="checkout" required>

    <label for="notes">Special Requests (Optional)</label>
    <textarea id="notes" name="notes" rows="4" placeholder="Let us know if you need early check-in, late check-out, etc."></textarea>

    <p id="priceDisplay">Hotel Price: ₹0</p>
    <p class="note">* You will receive a confirmation email after successful booking.</p>

    <input type="submit" value="Book Hotel">
  </form>
</section>

<!-- ✅ Razorpay JS SDK -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
  // ✅ Login check
  if (sessionStorage.getItem("isLoggedIn") !== "true") {
    sessionStorage.setItem("redirectAfterLogin", window.location.pathname.split("/").pop());
    alert("Please login first to book a hotel.");
    window.location.href = "login.html";
  }

  // ✅ Update displayed price when hotel changes
  document.getElementById("hotel").addEventListener("change", function () {
    const selectedOption = this.options[this.selectedIndex];
    const price = selectedOption.getAttribute("data-price") || 0;
    sessionStorage.setItem("hotelPrice", price);
    document.getElementById("priceDisplay").textContent = "Hotel Price: ₹" + price;
  });

  // ✅ Razorpay booking
  document.getElementById("hotelBookingForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const hotel = document.getElementById("hotel").value;
    const rooms = document.getElementById("rooms").value;
    const guests = document.getElementById("guests").value;
    const amount = (sessionStorage.getItem("hotelPrice") || 1500) * rooms * 100; // ₹ → paise

    const options = {
      "key": "rzp_test_RSqFKGi7MeMyIK", // Your Razorpay Test Key ID
      "amount": amount,
      "currency": "INR",
      "name": "Maheshwar Tourism",
      "description": `Hotel Booking: ${hotel}`,
      "image": "https://upload.wikimedia.org/wikipedia/commons/6/6a/Maheshwar_Fort.jpg",
      "handler": function (response) {
        alert("✅ Payment Successful! Payment ID: " + response.razorpay_payment_id);
        // You can send booking + payment details to backend here
        window.location.href = "project-DEMO.html";
      },
      "prefill": {
        "name": name,
        "email": email,
        "contact": phone
      },
      "theme": {
        "color": "#ff9800"
      }
    };

    const rzp1 = new Razorpay(options);
    rzp1.open();
  });
</script>

</body>
</html>
