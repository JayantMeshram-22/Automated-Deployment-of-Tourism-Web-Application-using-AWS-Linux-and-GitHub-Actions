<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Let's Plan Your Trip - Maheshwar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f7fa;
      margin: 0;
      color: #333;
    }
    header {
      background-color: #222;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #ff9800;
    }
    .intro {
      text-align: center;
      font-size: 18px;
      margin-bottom: 25px;
      color: #555;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin-top: 15px;
      font-weight: bold;
    }
    input, select, textarea {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }
    textarea {
      resize: vertical;
    }
    .submit-btn {
      margin-top: 25px;
      padding: 12px;
      background-color: #ff9800;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .submit-btn:hover {
      background-color: #e68900;
    }
  </style>
</head>
<body>

<header>
  <h1>Maheshwar Tourism</h1>
</header>

<div class="container">
  <h1>Let's Plan Your Trip</h1>
  <p class="intro">Customize your perfect Maheshwar experience. We'll help you make it memorable.</p>
  
  <form id="planForm" onsubmit="planTrip(event)">
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" required placeholder="Enter your full name">

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required placeholder="Enter your email">

    <label for="days">Number of Days</label>
    <select id="days" name="days" required>
      <option value="">--Select--</option>
      <option value="1">1 Day</option>
      <option value="2">2 Days</option>
      <option value="3">3 Days</option>
      <option value="4">4 Days</option>
      <option value="custom">More than 4 Days</option>
    </select>

    <label>Your Interests</label>
    <div style="margin-top: 10px; margin-bottom: 20px;">
      <label><input type="checkbox" name="interests[]" value="Heritage Sites"> Heritage Sites</label><br>
      <label><input type="checkbox" name="interests[]" value="Temples & Spiritual"> Temples & Spiritual</label><br>
      <label><input type="checkbox" name="interests[]" value="Nature & Scenic Views"> Nature & Scenic Views</label><br>
      <label><input type="checkbox" name="interests[]" value="Local Culture & Art"> Local Culture & Art</label><br>
      <label><input type="checkbox" name="interests[]" value="Boating & Riverside"> Boating & Riverside</label>
    </div>

    <label for="travelers">Total Travelers</label>
    <input type="number" id="travelers" name="travelers" placeholder="e.g. 2" required min="1">

    <label for="notes">Additional Notes (optional)</label>
    <textarea id="notes" name="notes" rows="4" placeholder="Tell us if you have anything specific in mind..."></textarea>

    <input type="submit" class="submit-btn" value="Plan My Trip">
  </form>
</div>

<script>
  // ✅ Check login status first
  if (sessionStorage.getItem("isLoggedIn") !== "true") {
    // Save current page for redirect
    sessionStorage.setItem("redirectAfterLogin", window.location.pathname.split("/").pop());
    alert("Please login first to book a trip.");
    window.location.href = "login.html";
  }

  // ✅ Booking form handler
  document.getElementById("tripBookingForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Your trip is confirmed!");
    window.location.href = "project-DEMO.html"; // after booking, go home or bookings page
  });
</script>

</body>
</html>

<script>
  // ✅ Check login
  if (sessionStorage.getItem("isLoggedIn") !== "true") {
    alert("Please login first to plan your trip.");
    window.location.href = "login.html";
  }

  // ✅ Submit trip plan
  document.getElementById("planForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const days = document.getElementById("days").value;
    const travelers = document.getElementById("travelers").value;
    const notes = document.getElementById("notes").value;
    const interests = [...document.querySelectorAll('input[name="interests[]"]:checked')].map(i => i.value);

    const res = await fetch("http://127.0.0.1:5000/api/plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, days, travelers, interests, notes })
    });

    const data = await res.json();
    alert(data.message);

    if (res.ok) window.location.href = "project-DEMO.html";
  });
</script>
