<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Your Trip - Maheshwar Tourism</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f9f9f9; color: #333; }
    header { background-color: #222; color: white; padding: 20px; text-align: center; }
    header h1 { margin: 0; }
    .booking-container { max-width: 700px; margin: 30px auto; background: #fff; padding: 30px;
      border-radius: 10px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.1); }
    .booking-container h2 { text-align: center; color: #ff9800; margin-bottom: 20px; }
    label { margin-bottom: 5px; font-weight: 600; display: block; }
    input, select, textarea {
      padding: 12px; margin-bottom: 20px;
      border-radius: 6px; border: 1px solid #ccc; font-size: 15px; width: 100%;
    }
    input[type="submit"] {
      background-color: #ff9800; color: white; border: none; font-weight: bold;
      cursor: pointer; transition: background 0.3s ease; padding: 12px;
    }
    input[type="submit"]:hover { background-color: #e68a00; }
    .note { font-size: 13px; color: #777; text-align: center; margin-top: -10px; margin-bottom: 20px; }
  </style>
</head>
<body>

<header>
  <h1>Maheshwar Tourism</h1>
</header>

<section class="booking-container">
  <h2>Book Your Trip</h2>
  <form id="tripBookingForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="location">Destination</label>
    <select id="location" name="location" required>
      <option value="">-- Select a location --</option>
      <option value="Ahilya Fort" data-price="999">Ahilya Fort - ₹999.00</option>
      <option value="Ahilya Ghat" data-price="1999">Ahilya Ghat - ₹1999.00</option>
      <option value="Rajwada & Temples" data-price="3999">Rajwada & Temples - ₹3999.00</option>
      <option value="Jam Gate" data-price="2000">Jam Gate - ₹2000.00</option>
      <option value="Mandleshwar" data-price="3999">Mandleshwar - ₹3999.00</option>
      <option value="Navdatoli Site" data-price="4999">Navdatoli Site - ₹4999.00</option>
    </select>

    <label for="guests">Number of Guests</label>
    <input type="number" id="guests" name="guests" placeholder="e.g., 2" min="1" required>

    <label for="arrival">Arrival</label>
    <input type="date" id="arrival" name="arrival" required>

    <label for="departure">Departure</label>
    <input type="date" id="departure" name="departure" required>

    <label for="pickup">Pickup From</label>
    <input type="text" id="pickup" name="pickup" placeholder="Enter pickup location" required>

    <label for="drop">Drop Location</label>
    <input type="text" id="drop" name="drop" placeholder="Enter drop location" required>

    <label for="notes">Special Requests (Optional)</label>
    <textarea id="notes" name="notes" rows="4" placeholder="Let us know if you have any special requests..."></textarea>

    <p class="note">* You will receive a confirmation email after successful booking.</p>

    <input type="submit" value="Book Now">
  </form>
</section>

<!-- ✅ Razorpay JS SDK -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
  // ✅ Check login status first
  if (sessionStorage.getItem("isLoggedIn") !== "true") {
    sessionStorage.setItem("redirectAfterLogin", window.location.pathname.split("/").pop());
    alert("Please login first to book a trip.");
    window.location.href = "login.html";
  }

  // ✅ Booking form handler with Razorpay
  document.getElementById("tripBookingForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Get user details
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const destinationSelect = document.getElementById("location");
    const destination = destinationSelect.value;

    // ✅ Get selected option's price dynamically
    const selectedOption = destinationSelect.options[destinationSelect.selectedIndex];
    const price = selectedOption.getAttribute("data-price");
    const amount = parseInt(price) * 100; // convert ₹ to paise

    // Razorpay options
    const options = {
      "key": "rzp_test_RSqFKGi7MeMyIK", // 🔑 Your Razorpay Test Key ID
      "amount": amount,
      "currency": "INR",
      "name": "Maheshwar Tourism",
      "description": `Trip Booking: ${destination}`,
      "image": "https://upload.wikimedia.org/wikipedia/commons/6/6a/Maheshwar_Fort.jpg",
      "handler": function (response) {
        alert(`✅ Payment Successful! Payment ID: ${response.razorpay_payment_id}`);
        // Optional: send booking + payment details to backend
        window.location.href = "project-DEMO.html";
      },
      "prefill": {
        "name": name,
        "email": email,
        "contact": phone
      },
      "theme": { "color": "#ff9800" }
    };

    const rzp1 = new Razorpay(options);
    rzp1.open();
  });
</script>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="script.js"></script>

</body>
</html>
